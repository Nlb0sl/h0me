<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>h0me.</title>
  <link rel="stylesheet" href="./styles/main.css">
  <script type="module" src="./scripts/main.js"></script>
</head>
<body>
  <main class="resume">
    <header class="resume__heading">
      <span>PERSONAL RECORD</span>
      <span>h0me. / 001</span>
    </header>
    <div class="identity">
      <figure class="portrait slideshow" data-component="shader" aria-label="nlb0sl の生成アバター">
        <img class="slideshow__image" src="./assets/photos/mouth-rest.svg" alt="音声に反応する口のグラフィック" draggable="false" fetchpriority="high">
        <canvas class="shader-canvas" aria-hidden="true" hidden></canvas>
      </figure>
      <section class="identity__details" aria-labelledby="name">
        <div class="identity__name">
          <span class="field-label">氏名 / NAME</span>
          <h1 id="name">nlb0sl</h1>
        </div>
        <dl class="fields">
          <div><dt>肩書き / ROLE</dt><dd>—</dd></div>
          <div><dt>所在地 / LOCATION</dt><dd>—</dd></div>
          <div><dt>リンク / LINKS</dt><dd><a href="https://github.com/Nlb0sl">GitHub ↗</a></dd></div>
        </dl>
        <div class="voice-controls" data-component="voice">
          <button type="button" data-screen>共有音声</button>
          <button type="button" data-mic>マイク</button>
          <button type="button" data-stop disabled>停止</button>
          <button type="button" data-test>TEST</button>
          <output data-voice-status aria-live="polite">OFF</output>
        </div>
      </section>
    </div>
    <section class="record">
      <h2>自己紹介 <span>ABOUT</span></h2>
      <div class="record__body">
        <p>—</p>
      </div>
    </section>
    <section class="record">
      <h2>興味・活動 <span>INTERESTS</span></h2>
      <div class="record__body">
        <p>—</p>
      </div>
    </section>
    <footer class="resume__footer"><span>PERSONAL WEBSITE</span><span><a href="./THIRD_PARTY_NOTICES.md">OSS LICENSES</a> · 01 / 01</span></footer>
  </main>
</body>
</html>
