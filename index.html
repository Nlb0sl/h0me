<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2ee">
  <title>nlb0sl</title>
  <link rel="stylesheet" href="./styles/site.css?v=5">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <h1>nlb0sl</h1>
      <nav aria-label="リンク"><a href="https://github.com/Nlb0sl">GitHub ↗</a></nav>
    </header>
    <figure class="exhibit">
      <div class="exhibit__frame">
        <div class="artwork" role="img" aria-label="回転するリングと順番に明るくなる n l b 0 s l の文字">
          <div class="assembly" aria-hidden="true">
            <div class="rotor">
              <div class="rotor__outer"></div>
              <div class="rotor__middle"></div>
              <div class="rotor__inner"></div>
              <div class="rotor__core"></div>
            </div>
            <div class="letters">
              <span style="--i:0;--delay:0s">n</span>
              <span style="--i:1;--delay:-10s">l</span>
              <span style="--i:2;--delay:-8s">b</span>
              <span style="--i:3;--delay:-6s">0</span>
              <span style="--i:4;--delay:-4s">s</span>
              <span style="--i:5;--delay:-2s">l</span>
            </div>
          </div>
        </div>
      </div>
    </figure>
  </main>
</body>
</html>
